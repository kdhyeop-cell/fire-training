<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주소방서 훈련 관리 대시보드</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .header { background-color: #d32f2f; color: white; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn { display: inline-block; padding: 10px 20px; background-color: #1976d2; color: white; text-decoration: none; border-radius: 5px; text-align: center; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚒 제주소방서 현장대응단 훈련 관리 시스템 (Prototype)</h1>
    </div>

    <div class="grid-container">
        <div class="card">
            <h2>📊 금일 훈련 현황</h2>
            <p>오늘 예정된 훈련: <strong>노형119센터 (다중이용업소)</strong></p>
            <p>훈련 진행 상태: <span style="color: red;">평가 대기중</span></p>
        </div>
        <div class="card">
            <h2>📱 평가 메뉴</h2>
            <p>현장에서 모바일로 즉시 평가를 진행하세요.</p>
            <a href="#" class="btn">현장지휘팀장 평가하기</a>
            <a href="#" class="btn">안전점검관 평가하기</a>
        </div>
    </div>

</body>
</html>
